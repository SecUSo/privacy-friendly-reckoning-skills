plugins {
    alias(libs.plugins.android.app)
    alias(libs.plugins.kotlin.android)
}
android {
    compileSdk 34
    namespace "org.secuso.privacyfriendlyreckoningskills"

    defaultConfig {
        applicationId "org.secuso.privacyfriendlyrecknoningskills"
        minSdkVersion 17
        targetSdkVersion 34
        versionCode 101
        versionName "1.2.0"
        multiDexEnabled true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
        viewBinding true
        dataBinding true
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    kotlin {
        jvmToolchain(17)
    }

    lint {
        lintConfig = file("lint.xml")
    }

    android.applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            def appName = "pfa-reckoning-skills"
            outputFileName = appName + "-${variant.name}-v${variant.versionName}.apk"
        }
    }

}

dependencies {
    // Dependencies available in PFA-Core version catalog
    implementation libs.ax.appcompat
    implementation libs.material
    implementation libs.ax.legacy.v4
    implementation libs.ax.constraintlayout
    implementation libs.ax.sqlite.ktx
    implementation libs.ax.work.runtime
    implementation libs.ax.work.runtime.ktx
    implementation libs.multidex

    testImplementation libs.junit
    androidTestImplementation libs.ax.work.testing

    implementation libs.ax.viewpager
    implementation libs.ax.fragment
    implementation libs.ax.drawerlayout

    // PFA-Core
    implementation project(':model')
    implementation project(':ui-view')

    // Backup API supplied through PFA-Core
    implementation project(':backup-api')

    coreLibraryDesugaring(libs.desugar.jdk)
}
